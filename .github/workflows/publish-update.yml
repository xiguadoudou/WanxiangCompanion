name: Publish Android update
on:
  push:
    branches: [main]
    paths:
      - 'updates/**'
      - 'android/**'
      - '.github/workflows/publish-update.yml'
      - '.github/scripts/**'
      - 'tests/test_source_release.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check APK/source publication rules
        run: python3 -m unittest discover -s tests -p 'test_source_release.py' -v
      - name: Verify package and publish APK with source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish-release.py
