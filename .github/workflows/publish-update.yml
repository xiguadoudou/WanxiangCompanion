name: Publish Android update
on:
  push:
    branches: [main]
    paths:
      - 'updates/**'
      - 'android/**'
      - '.github/workflows/publish-update.yml'
      - '.github/scripts/**'
      - 'tests/test_source_release.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check APK/source publication rules
        run: python3 -m unittest discover -s tests -p 'test_source_release.py' -v
      - name: Check overlay recovery and persistent image cache
        run: |
          mkdir -p "$RUNNER_TEMP/wxq-native"
          java -m jdk.compiler/com.sun.tools.javac.Main --release 8 -encoding UTF-8 -d "$RUNNER_TEMP/wxq-native" android/src/com/doudou/wxq/{BuildInfo,OverlayState,OverlayWindowSession,OverlayStartGate,ImageDiskCache}.java android/tests/{OverlayReliabilityTest,ImageDiskCacheTest}.java
          java -cp "$RUNNER_TEMP/wxq-native" com.doudou.wxq.OverlayReliabilityTest
          java -cp "$RUNNER_TEMP/wxq-native" com.doudou.wxq.ImageDiskCacheTest
      - name: Verify package and publish APK with source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish-release.py
