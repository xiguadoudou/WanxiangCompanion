name: Publish Android update
on:
  push:
    branches: [main]
    paths:
      - 'updates/**'
      - 'android/**'
      - '.github/workflows/publish-update.yml'
      - '.github/scripts/**'
      - 'tests/test_source_release.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check APK/source publication rules
        run: python3 -m unittest discover -s tests -p 'test_source_release.py' -v
      - name: Check download page acceleration and fallback
        run: node tests/download.test.cjs
      - name: Check overlay recovery and persistent image cache
        run: |
          mkdir -p "$RUNNER_TEMP/wxq-native"
          java -m jdk.compiler/com.sun.tools.javac.Main --release 8 -encoding UTF-8 -d "$RUNNER_TEMP/wxq-native" android/src/com/doudou/wxq/{BuildInfo,OverlayState,OverlayGeometry,DragTapTracker,OverlayWindowSession,OverlayStartGate,ImageDiskCache}.java android/tests/{OverlayModelTest,OverlayReliabilityTest,ImageDiskCacheTest}.java
          java -cp "$RUNNER_TEMP/wxq-native" com.doudou.wxq.OverlayModelTest
          java -cp "$RUNNER_TEMP/wxq-native" com.doudou.wxq.OverlayReliabilityTest
          java -cp "$RUNNER_TEMP/wxq-native" com.doudou.wxq.ImageDiskCacheTest
      - name: Check update proxy routing and fallback
        run: |
          curl --fail --silent --show-error --retry 2 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o "$RUNNER_TEMP/wxq-json.jar"
          python3 - <<'PY_HASH'
          import hashlib, os
          from pathlib import Path
          assert hashlib.sha256(Path(os.environ['RUNNER_TEMP'], 'wxq-json.jar').read_bytes()).hexdigest() == '3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed'
          PY_HASH
          mkdir -p "$RUNNER_TEMP/wxq-updates"
          java -m jdk.compiler/com.sun.tools.javac.Main --release 8 -encoding UTF-8 -cp "$RUNNER_TEMP/wxq-json.jar" -d "$RUNNER_TEMP/wxq-updates" android/src/com/doudou/wxq/{BuildInfo,UpdateContract,UpdateTransport,UpdateRoutes,UpdateCheck}.java android/tests/{UpdateRoutesTest,UpdateContractTest}.java
          java -cp "$RUNNER_TEMP/wxq-updates:$RUNNER_TEMP/wxq-json.jar" com.doudou.wxq.UpdateRoutesTest
          java -cp "$RUNNER_TEMP/wxq-updates:$RUNNER_TEMP/wxq-json.jar" com.doudou.wxq.UpdateContractTest
      - name: Verify package and publish APK with source
        # Metadata fallback and canonical/proxy URL rules are also checked on the host JVM.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish-release.py
